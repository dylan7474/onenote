<!DOCTYPE html>
<html lang="en-US">
<head><title>Tagged Page</title></head>
<body>
    <div style="position:absolute;left:48px;top:100px;width:600px">
        <h1>Tagged Page</h1>
        <p data-tag="important">A priority note.</p>
        <p data-tag="question">Something to check.</p>
        <p data-tag="important, critical">Both at once.</p>
        <p data-tag="web-site-to-visit">https://example.com</p>
        <p data-tag="to-do">Open task</p>
        <p data-tag="to-do:completed">Finished task</p>
    </div>
</body>
</html>
